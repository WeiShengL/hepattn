name: CLD_8_320_10MeV_neutrals_track_topo

matmul_precision: high

data:
  # Paths to preprocessed data directories
  train_dir: /global/cfs/cdirs/m2616/wlai/cld/prepped_with_mask/train
  val_dir: /global/cfs/cdirs/m2616/wlai/cld/prepped_with_mask/val
  test_dir: /global/cfs/cdirs/m2616/wlai/cld/prepped_with_mask/test

  # Number of events to include in each set
  num_workers: 2
  num_train: 100000
  num_test: 1000
  num_val: 100

  # Minibatch size / number of events used per training step
  batch_size: 8

  # Precision of any float values returned by the dataloader
  input_dtype: float32
  target_dtype: float32

  input_pad_value: 0.0
  target_pad_value: 0.0

  # Minimum pT for a particle to be deemed reconstructve in GeV
  particle_min_pt: 0.01
  particle_max_abs_eta: 4.0

  # Whether to include charged / neutral particles as targets
  include_charged: true
  include_neutral: true

  # Number of query slots / particles to generate per event
  force_pad_sizes:
    particle: &num_particles 320
    pandora: *num_particles
    sitrack: *num_particles

  skip_pad_items: []

  sampling_seed: 42

  # Charged particle cuts based on hit content
  charged_particle_min_num_hits:
    vtxd: 0
    trkr: 0
    sihit: 4

  # Charged particle cuts based on hit content
  charged_particle_max_num_hits:
    vtxd: 12
    trkr: 12
    sihit: 24

  particle_cut_veto_min_num_hits:
    ecal: 32
    hcal: 16

  # Cuts on minimum fraction of particle pT a hit should have
  particle_hit_min_p_ratio:
    vtxd: 0.01
    trkr: 0.01

  # Cuts on maximum deflection between subsequent hits
  particle_hit_deflection_cuts:
    vtxd:
      max_angle: 0.25
      max_angle_xy: -1
      max_angle_rz: -1
      num_passes: 8
    trkr:
      max_angle: 1.0
      max_angle_xy: -1
      max_angle_rz: -1
      num_passes: 12

  # Cuts on maximum distance between subsequent hit
  particle_hit_separation_cuts:
    vtxd:
      max_dist: 0.25
      num_passes: 8
    trkr:
      max_dist: 1.5
      num_passes: 12

  truth_filter_hits: []

  merge_inputs:
    vtxd:
      - vtb
      - vte

    trkr:
      - itb
      - ite
      - otb
      - ote

    sihit:
      - vtb
      - vte
      - itb
      - ite
      - otb
      - ote

    ecal:
      - ecb
      - ece

    hcal:
      - hcb
      - hce
      - hco

    muon:
      - msb
      - mse

  inputs:
    vtxd:
      - type
      # - quality
      - pos.x
      - pos.y
      - pos.z
      # - pos.s
      # - pos.r
      # - pos.theta
      # - pos.eta
      # - pos.phi
      # - pos.u
      # - pos.v
      # - eDep
      # - eDepError
      - time
      # - u.a
      # - u.b
      # - v.a
      # - v.b
      # - du
      # - dv

    trkr:
      - type
      # - quality
      - pos.x
      - pos.y
      - pos.z
      # - pos.s
      # - pos.r
      # - pos.theta
      # - pos.eta
      # - pos.phi
      # - pos.u
      # - pos.v
      # - eDep
      # - eDepError
      - time
      # - u.a
      # - u.b
      # - v.a
      # - v.b
      # - du
      # - dv

    sihit:
      - type

    ecal:
      - type
      - pos.x
      - pos.y
      - pos.z
      # - pos.s
      # - pos.r
      # - pos.theta
      # - pos.eta
      # - pos.phi
      # - pos.u
      # - pos.v
      # - energy
      # - log_energy
      # - energyError
      - time

    hcal:
      - type
      - pos.x
      - pos.y
      - pos.z
      # - pos.s
      # - pos.r
      # - pos.theta
      # - pos.eta
      # - pos.phi
      # - pos.u
      # - pos.v
      # - energy
      # - log_energy
      # - energyError
      - time

    muon:
      - type
      - pos.x
      - pos.y
      - pos.z
      # - pos.s
      # - pos.r
      # - pos.theta
      # - pos.eta
      # - pos.phi
      # - pos.u
      # - pos.v
      # - energy
      # - log_energy
      # - energyError
      - time

    sitrack:
      - Nholes
      - chi2
      - d0_atCalorimeter
      - d0_atFirstHit
      - d0_atIP
      - d0_atLastHit
      - ndf
      - omega_atCalorimeter
      - omega_atFirstHit
      - omega_atIP
      - omega_atLastHit
      - phi_atCalorimeter
      - phi_atFirstHit
      - phi_atIP
      - phi_atLastHit
      - tanlambda_atCalorimeter
      - tanlambda_atFirstHit
      - tanlambda_atIP
      - tanlambda_atLastHit
      - type
      - z0_atCalorimeter
      - z0_atFirstHit
      - z0_atIP
      - z0_atLastHit

    topocluster:
      - dir_err.x
      - dir_err.y
      - dir_err.z
      - energy
      - energyError
      - iTheta
      - phi
      - pos.x
      - pos.y
      - pos.z
      # - positionError.values[6]
      - type

  targets:
    particle:
      - PDG
      - charge
      - time
      - mass
      - energy
      # Particle creation vertex coordinates
      - vtx.x
      - vtx.y
      - vtx.z
      - vtx.r
      # Production momentum coordinates
      - mom.x
      - mom.y
      - mom.z
      - mom.r
      - mom.eta
      - mom.abs_eta
      - mom.phi
      - mom.theta
      - mom.eta_drad
      - mom.phi_drad
      - mom.rinv
      - mom.qopt
      # Spin coordinates
      - spin.x
      - spin.y
      - spin.z
      # Constituent count info
      - num_vtxd
      - num_trkr
      - num_ecal
      - num_hcal
      - num_sihit
      - num_muon
      # Angular isolation
      - isolation
      # Calorimeter energy info
      - energy_ecal
      - energy_hcal
      - calib_energy_ecal
      - calib_energy_hcal
      - calib_energy_calo
      # Binary particle class info
      - is_charged
      - is_neutral
      - is_neutral_hadron
      - is_charged_hadron
      - is_photon
      - is_electron
      - is_muon
      - is_tau
      - is_neutrino
      - is_other
      - is_primary
      - is_secondary


    particle_vtxd:
      - pos.x
      - pos.y
      - pos.z
      - pos.r
      - pos.theta
      - pos.phi
      - mom.x
      - mom.y
      - mom.z
      - mom.r
      - mom.rinv
      - mom.theta
      - mom.phi

    particle_trkr:
      - pos.x
      - pos.y
      - pos.z
      - pos.r
      - pos.theta
      - pos.phi
      - mom.x
      - mom.y
      - mom.z
      - mom.r
      - mom.rinv
      - mom.theta
      - mom.phi

    particle_ecal:
      - energy
      - energy_frac
      - log_energy

    particle_hcal:
      - energy
      - energy_frac
      - log_energy

    particle_muon:
      - energy

    # Pandora reconstruction info
    pandora:
      - PDG
      - charge
      - ref.x
      - ref.y
      - ref.z
      - ref.r
      - mom.x
      - mom.y
      - mom.z
      - mom.r
      - mom.eta
      - mom.abs_eta
      - is_charged
      - is_neutral

    pandora_vtxd: []

    pandora_trkr: []

    pandora_ecal: []

    pandora_hcal: []

    pandora_muon: []

    # Conformal tracking info
    # sitrack:
    #   - type
    #   - chi2
    #   - ndf

    sitrack_vtxd: []

    sitrack_trkr: []

    particle_sitrack: []

    particle_topocluster: []

# Training stuff here
trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 10
  default_root_dir: logs
  gradient_clip_val: 0.1
  accumulate_grad_batches: 1
  enable_progress_bar: True

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: cld

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: train/loss
        every_n_train_steps: 10
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  optimizer: lion

  lrs_config:
    initial: 1e-5
    max: 4e-5
    end: 1e-6
    pct_start: 0.01
    skip_scheduler: false
    weight_decay: 1e-5

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      dim: &dim 256
      # input_sort_field: pos.phi

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: sitrack
                input_dtype: float32
                fields:
                  - Nholes
                  - chi2
                  - d0_atIP
                  - ndf
                  - omega_atIP
                  - phi_atIP
                  - tanlambda_atIP
                  - type
                  - z0_atIP
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 9
                    output_size: *dim
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: sitrack
                    dim: *dim
                    fields:
                      - d0_atIP
                      - tanlambda_atIP

            - class_path: hepattn.models.InputNet
              init_args:
                input_name: topocluster
                input_dtype: float32
                fields:
                  - energy
                  - energyError
                  - iTheta
                  - phi
                  - pos.x
                  - pos.y
                  - pos.z
                  - type
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 8
                    output_size: *dim
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: topocluster
                    dim: *dim
                    fields:
                      - pos.x
                      - pos.y
                      - pos.z

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: *dim
          attn_type: flash-varlen
          window_size: 1024
          window_wrap: true
          hybrid_norm: true
          value_residual: true
          attn_kwargs:
            num_heads: 8

      decoder:
        num_decoder_layers: 8
        num_queries: *num_particles
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: *dim
          hybrid_norm: true
          attn_kwargs:
            num_heads: 8

      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectValidTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 0.1
                costs:
                  object_bce: 1.0
                dim: *dim
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: False

            - class_path: hepattn.models.task.ClassificationTask
              init_args:
                name: pid
                input_object: query
                output_object: pid
                target_object: particle
                classes: [is_muon, is_electron, is_photon, is_charged_hadron, is_neutral_hadron, is_other]  # priority = list order (left = highest)
                dim: *dim
                class_weights: {is_muon: 24.45, is_electron: 7.8, is_photon: 1.0, is_charged_hadron: 1.1, is_neutral_hadron: 8.5, is_other: 566}
                loss_weight: 1.0
                multilabel: false
                permute_loss: true
                has_intermediate_loss: false

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_track_assignment
                input_constituent: sitrack
                input_object: query
                output_object: flow
                target_object: particle
                has_intermediate_loss: False
                losses:
                  mask_bce: 0.25
                  mask_dice: 0.75
                  #mask_focal: 1.0
                costs:
                  #mask_bce: 1.0
                  mask_dice: 1.0
                  #mask_focal: 1.0
                dim: *dim
                null_weight: 1.0

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_topo_assignment
                input_constituent: topocluster
                input_object: query
                output_object: flow
                target_object: particle
                has_intermediate_loss: False
                losses:
                  mask_bce: 0.25
                  mask_dice: 0.75
                  #mask_focal: 1.0
                costs:
                  #mask_bce: 1.0
                  mask_dice: 1.0
                  #mask_focal: 1.0
                dim: *dim
                null_weight: 1.0